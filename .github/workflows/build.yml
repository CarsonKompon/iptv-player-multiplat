# Builds every platform on GitHub's own machines - no WSL / Mac needed.
#
#   Run it:   GitHub repo -> Actions -> "Build" -> "Run workflow"
#             (or push a tag like v1.0.0 to also publish a GitHub Release)
#   Get it:   the run's page -> "Artifacts" (zip per OS), or the Release.
name: Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux + Android + Web
            os: ubuntu-latest
            targets: linux android web
          - name: macOS
            os: macos-latest
            targets: macos
          - name: Windows
            os: windows-latest
            targets: windows

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev zip

      - name: Java for Android
        if: runner.os == 'Linux'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # scripts may have been saved with Windows line endings
      - name: Setup (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          sed -i.bak 's/\r$//' setup.sh build.sh && rm -f setup.sh.bak build.sh.bak
          chmod +x setup.sh build.sh
          ./setup.sh

      - name: Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./setup.ps1

      - name: Build (macOS / Linux)
        if: runner.os != 'Windows'
        run: ./build.sh ${{ matrix.targets }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build.ps1 -Platforms ${{ matrix.targets }}

      - uses: actions/upload-artifact@v4
        with:
          name: IPTVGuide-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
